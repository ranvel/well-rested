[project]
name = "well-rested"
version = "0.1.0"
description = "GET-only pass-through REST cache proxy"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ran mak", email = "ranvel@ranvel.com" }]
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115",
	"uvicorn>=0.30",
	"httpx[socks]>=0.27",   # socksio, for socks5:// outbound proxies
	"keyring>=25",
	"jinja2>=3.1",
	"python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"pytest-asyncio>=0.25",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
	"keychain: touches the real macOS Keychain (opt in with WR_TEST_KEYCHAIN=1)",
]
